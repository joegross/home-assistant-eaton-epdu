[pytest]
# No global testpaths: the two suites need different plugin environments.
#
# tests/unit       — standalone stubs (imports homeassistant as fakes).
#   Run:            PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest tests/unit
#   (the HA-harness plugin must NOT load; conftest stubs would clash)
#
# tests/integration — real Home Assistant test instance via
#   pytest-homeassistant-custom-component.
#   Run:            pytest tests/integration -o asyncio_mode=auto
#
# CI wires both in .github/workflows/test.yaml with the right env.
asyncio_mode = auto